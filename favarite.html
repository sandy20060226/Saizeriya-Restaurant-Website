<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推薦網頁</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* 設定背景顏色為黑色 */
            color: #ffffff; /* 設定文字顏色為白色 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center; /* 讓文字內容置中 */
            flex: 1; /* 使內容區域填滿剩餘空間 */
            padding-bottom: 50px; /* 增加頁尾空間 */
        }
        img {
            max-width: 80%;
            width: 500px;
            height: 400px;
            margin: 20px 0;
            border: 10px solid white; /* 圖片外圍包一圈白色 */
        }
        h1, h2 {
            margin: 20px 0;
            text-align: center; /* 確保標題置中 */
        }
        ul {
            text-align: center; /* 讓列表項目置中 */
            max-width: 80%;
            font-size: 18px;
            padding: 0;
            list-style-type: disc;
            margin: 20px auto;
        }
        li {
            margin: 10px 0;
        }
        .additional-images {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .additional-images img {
            max-width: 200%;
            border: 5px solid white;
        }
        footer {
            padding: 20px 0;
            background-color: #333; /* 深灰色的頁尾背景 */
            width: 100%;
            text-align: center; /* 讓頁尾文字置中 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>推薦網頁</h1>
        <img src="image/61.jpg" alt="主圖片">
        <h2>喜愛的原因</h2>
        <ul>
            <h3>1.網站具有非常多韓劇、動漫等可以觀看</h3>
            <h3>2.具有評分的功能可以使網站推薦出自己可能喜歡的影片</h3>
            <h3>3.網站區塊做得很好，不僅有推薦影片，也有觀看紀錄、類型區分等區塊，不會讓使用者無所適從</h3>
			<h3>缺點:一個帳號中，使用者可以互相點進對方的帳號，較無隱私</h3>
        </ul>
        <div class="additional-images">
            <img src="image/81.jpg" alt="額外圖片1">
            <img src="image/92.jpg" alt="額外圖片2">
            <img src="image/82.jpg" alt="額外圖片3">
        </div>
    </div>
    <footer>
        <p>!!!!!作者真心推薦!!!!!</p>
    </footer>
</body>
</html>
