<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">

  <style>
  #eight {font-family: 娃娃體, 流葉體, monospace;}
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #008000; /* 背景设为绿色 */
      color:white; /* 字体颜色改为白色 */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .section {
      margin-bottom: 40px;
      padding: 20px;
      background-color:#556b2f;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      color:white;
      text-align: center;
      width: 80%;
    }

    .section h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color:white;
    }

    .section ul {
      list-style-type: none;
      padding-left: 0;
    }

    .section ul li {
      display: flex; /* 使用 Flexbox 布局 */
      align-items: center; /* 垂直居中对齐 */
      justify-content: flex-start; /* 左对齐 */
      margin-bottom: 20px;
      font-size: 16px;
      flex-direction: row; /* 确保图片和文字水平排列 */
    }

    .section ul li img {
      width: 50px;
      height: 50px;
      margin-right: 10px; /* 图片和文字之间的间距 */
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .section ul li span {
      display:white;
      max-width: 80%; /* 限制文字宽度，避免过长 */
	  color:white;
    }
  </style>
</head>

 <body>
