<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="home.css" type="text/css">
  <title>手動圖片輪播</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: green;
    }

    .carousel-container {
      width: 800px;
      height: 800px;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
    }

    .carousel {
      display: flex;
      transition: transform 1s ease-in-out;
    }

    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 15px;
      cursor: pointer;
      font-size: 20px;
      z-index: 10;
    }

    .prev-button {
      left: 10px;
    }

    .next-button {
      right: 10px;
    }

    .section h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: white;
      text-align: center;
    }

    .recommendation {
      text-align: center;
      margin-top: 40px;
    }

    .recommendation h2 {
      font-size: 22px;
      color: white;
    }

    .recommendation-images {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    .recommendation-images .row {
      display: flex;
      align-items: center;
      gap: 50px;
    }

    .recommendation-images img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .plus {
      font-size: 24px;
      color: white;
    }

    .footer-space {
      height: 50px; /* 增加頁尾空間 */
    }
.vertical-text {
  writing-mode: vertical-lr; /* 讓文字垂直排列，從左到右 */
  font-size: 24px;
  font-weight: bold;
  color: white;
  margin-right: 5px; /* 與圖片之間的間距 */
}


  </style>
</head>
<body>
  <div class="section">
  <a href="index.html" class="home">回到主頁面</a>
    <h1>菜單介紹</h1>
    <div class="carousel-container">
      <div class="carousel">
        <img src="image/menu1.jpg" alt="Menu 1">
        <img src="image/menu2.jpg" alt="Menu 2">
        <img src="image/menu3.jpg" alt="Menu 3">
        <img src="image/menu4.jpg" alt="Menu 4">
        <img src="image/menu5.jpg" alt="Menu 5">
        <img src="image/menu6.jpg" alt="Menu 6">
      </div>
      <button class="carousel-button prev-button" onclick="moveSlide(-1)">&#10094;</button>
      <button class="carousel-button next-button" onclick="moveSlide(1)">&#10095;</button>
    </div>
  </div>

  <div class="recommendation">
  <h2>推薦搭配</h2>
  <div class="recommendation-images">
    <div class="row">
      <div class="vertical-text">佛卡</div>
      <img src="image/51.jpg">
      <span class="plus">+</span>
	  <div class="vertical-text">香草冰淇淋</div>
      <img src="image/52.jpg">
    </div>
    <div class="row">
      <div class="vertical-text">佛卡</div>
      <img src="image/51.jpg">
      <span class="plus">+</span>
	  <div class="vertical-text">田螺</div>
      <img src="image/53.jpg">
    </div>
    <div class="row">
      <div class="vertical-text">肉醬焗烤飯</div>
      <img src="image/54.jpg">
      <span class="plus">+</span>
	  <div class="vertical-text">半熟蛋</div>
      <img src="image/55.jpg">
    </div>
  </div>
</div>


  <div class="footer-space"></div> <!-- 增加頁尾空間 -->

  <script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.carousel img');
    const totalSlides = slides.length;

    function moveSlide(direction) {
      currentIndex += direction;

      if (currentIndex < 0) {
        currentIndex = totalSlides - 1;
      } else if (currentIndex >= totalSlides) {
        currentIndex = 0;
      }

      const newTransformValue = -currentIndex * 100;
      document.querySelector('.carousel').style.transform = `translateX(${newTransformValue}%)`;
    }
  </script>
</body>
</html>
